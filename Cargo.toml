[package]
name = "systray-wurstmineberg-status"
version = "2.10.0"
authors = ["Fenhl <fenhl@fenhl.net>"]
edition = "2024"
rust-version = "1.91" # nixpkgs stable
repository = "https://github.com/wurstmineberg/systray"

[lints.rust]
rust_2018_idioms = "deny"
unsafe_code = "forbid"
unused = "deny"
unused_crate_dependencies = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
warnings = "deny"

[profile.release]
codegen-units = 1
lto = true
strip = true

[dependencies]
clap = { version = "4", features = ["derive"] }
directories = "6"
futures = "0.3"
iced = { version = "0.14", default-features = false, features = ["image", "tiny-skia", "tokio"] }
image = { version = "0.25", default-features = false, features = ["ico"] }
itertools = "0.14"
log-lock = { git = "https://github.com/fenhl/log-lock" }
mimalloc = "0.1"
native-windows-derive = "1"
native-windows-gui = { version = "1", default-features = false, features = ["tray-notification", "high-dpi", "cursor", "message-window", "menu", "notice", "embed-resource"] }
open = "5"
registry = "1"
reqwest = { version = "0.13", default-features = false, features = ["charset", "gzip", "http2", "rustls-no-provider", "system-proxy", "zstd"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = { package = "serde_json_path_to_error", version = "0.1" }
serenity = { version = "0.12", default-features = false }
smart-default = "0.7"
thiserror = "2"
tokio = { version = "1", features = ["process", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1", features = ["serde"] }
wheel = { git = "https://github.com/fenhl/wheel", features = ["gui", "serde_json", "reqwest"] }
windows = { version = "0.62", features = ["UI_StartScreen"] }

[build-dependencies]
winresource = "0.1"
